# ═══════════════════════════════════════════════════════════════════════════════
# POLITECH AWARDS 2026 — POST-MERGE FINALIZATION
# ═══════════════════════════════════════════════════════════════════════════════
#
# Runs after a PR is merged to main. Uses the merged results.json (author's
# output) to update pr_status → "merged", top_project, and results/{version}.json.
# No algorithm run — we use whatever the author committed.
#
# ═══════════════════════════════════════════════════════════════════════════════

name: Post-Merge Finalization

on:
  pull_request:
    types: [closed]

jobs:
  finalize:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Finalize merge (update pr_status, snapshot results from merged results.json)
        env:
          MERGED_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx tsx scripts/finalize-merge.ts

      - name: Sync README
        run: npx tsx scripts/sync-readme.ts

      - name: Commit and push
        run: |
          git config user.name "iteration-details-updater[bot]"
          git config user.email "iteration-details-updater[bot]@users.noreply.github.com"
          git add iterations.json iterations/ README.md results/
          git diff --staged --quiet || git commit -m "bot: finalize merge — re-snapshot versioned results and update pr_status"
          git push
